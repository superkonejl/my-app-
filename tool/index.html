<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社畜下班啦！网易版魔性解压小游戏</title>
    <!-- 引入 Tailwind CSS 库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google 字体 Inter 与 ZCOOL KuaiLe -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'ZCOOL KuaiLe', sans-serif;
            background-color: #080b11;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overflow: hidden;
        }
        /* 荧光呼吸灯及发光阴影特效 */
        .neon-glow-primary {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }
        .neon-glow-danger {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
        }
        /* 噪点颗粒质感背景 */
        .noise-bg {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
            background-size: 20px 20px;
        }
        /* 玻璃拟态设计 */
        .glassmorphism {
            background: rgba(13, 18, 30, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="noise-bg text-white h-screen flex flex-col justify-between overflow-hidden">

<!-- 顶部极简整合状态栏 -->
<header class="w-full max-w-md mx-auto px-3 pt-2 z-10">
    <div class="glassmorphism rounded-xl p-2.5 flex items-center justify-between gap-2.5 relative">
        <!-- 简短Logo -->
        <div class="flex items-center gap-1.5 shrink-0">
            <span class="text-xl">🤪</span>
            <div>
                <h1 class="text-sm font-black tracking-wider text-purple-400">社畜下班啦</h1>
            </div>
        </div>

        <!-- 极简怨气进度条 (融合在顶部) -->
        <div class="flex-grow max-w-[130px] mx-1">
            <div class="flex justify-between text-[9px] text-gray-400 mb-0.5">
                <span class="font-bold flex items-center gap-0.5">🔥 怨气值</span>
                <span id="kpiValueText" class="font-extrabold text-red-400 animate-pulse">0%</span>
            </div>
            <div class="w-full bg-gray-950 h-1.5 rounded-full overflow-hidden border border-gray-800/80">
                <div id="kpiProgressBar" class="h-full bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 transition-all duration-300 w-0"></div>
            </div>
        </div>

        <!-- 紧凑音频与震动开关 -->
        <div class="flex gap-1 shrink-0">
            <button id="soundToggleBtn" class="w-7 h-7 rounded-lg bg-gray-900/90 flex items-center justify-center text-green-400 text-xs transition-all active:scale-95 border border-gray-800 hover:bg-gray-800" title="切换音效">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button id="vibrateToggleBtn" class="w-7 h-7 rounded-lg bg-gray-900/90 flex items-center justify-center text-amber-400 text-xs transition-all active:scale-95 border border-gray-800 hover:bg-gray-800" title="切换震动">
                <i class="fa-solid fa-heartbeat"></i>
            </button>
        </div>
    </div>
</header>

<!-- 角色快速切换滑块 (高度极度缩减) -->
<div class="w-full max-w-md mx-auto px-3 mt-1.5 z-10">
    <div class="flex rounded-xl bg-gray-950/90 border border-gray-800/40 p-1">
        <button onclick="switchCharacter('capybara')" id="tab-capybara" class="flex-1 py-1.5 text-xs font-bold flex items-center justify-center gap-1.5 rounded-lg transition-all border-b-0 text-purple-400 bg-purple-950/30">
            <span>🦫</span>
            <span>卡皮巴拉</span>
        </button>
        <button onclick="switchCharacter('slime')" id="tab-slime" class="flex-1 py-1.5 text-xs font-bold flex items-center justify-center gap-1.5 rounded-lg transition-all border-b-0 text-gray-400">
            <span>🐱</span>
            <span>史莱姆猫</span>
        </button>
        <button onclick="switchCharacter('fly')" id="tab-fly" class="flex-1 py-1.5 text-xs font-bold flex items-center justify-center gap-1.5 rounded-lg transition-all border-b-0 text-gray-400">
            <span>🪰</span>
            <span>打工蝇</span>
        </button>
    </div>
</div>

<!-- 全屏核心交互区域 (占据几乎全部剩余高度) -->
<main class="flex-grow w-full max-w-md mx-auto px-3 py-2 flex flex-col relative">
    <div class="flex-grow rounded-2xl overflow-hidden glassmorphism relative shadow-2xl flex flex-col border border-gray-800/50">
        <!-- 物理交互 Canvas -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

        <!-- 悬浮型“一键下班”爆裂大招按钮 (叠放在 Canvas 底部，节省出巨额视口高度) -->
        <div class="absolute bottom-3 left-3 right-3 z-1
