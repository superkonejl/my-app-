<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

        /* 100% 纯黑全面屏适配 */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100dvh; background-color: #000000; color: #E0E0E0; font-family: sans-serif; overflow: hidden; }
        
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; padding-bottom: env(safe-area-inset-bottom); }
        
        /* 页面面板控制 */
        .app-panel { display: none; flex-direction: column; width: 100%; flex: 1; overflow: hidden; }
        .app-panel.active { display: flex; }

        /* 顶部导航栏 */
        .top-bar { height: 55px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background-color: #111; border-bottom: 1px solid #222; }
        .top-title { font-size: 18px; font-weight: bold; color: #00E676; }
        .icon-btn { background: none; border: none; color: #E0E0E0; font-size: 26px; cursor: pointer; padding: 5px; }

        /* --- 1. 背诵主界面 --- */
        .card-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; perspective: 1000px; }
        .flashcard { width: 100%; height: 100%; max-width: 500px; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; cursor: pointer; }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background-color: #121212; border: 2px solid #252525; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
        .card-back { transform: rotateY(180deg); border-color: #00E676; justify-content: space-between; }
        
        /* 视力友好超级大字 */
        .card-text { font-size: 30px; font-weight: 700; line-height: 1.5; text-align: center; overflow-y: auto; max-height: 75%; width: 100%; color: #FFFFFF; }
        .card-tag { position: absolute; top: 16px; left: 20px; font-size: 14px; color: #888; background: #222; padding: 4px 12px; border-radius: 12px; font-weight: bold; }
        
        /* 折叠注解区 */
        .detail-wrapper { width: 100%; background: #181818; border: 1px solid #222; border-radius: 14px; overflow: hidden; margin-top: 10px; }
        .detail-header { padding: 10px; font-size: 15px; color: #00E676; background: #222; text-align: center; font-weight: bold; }
        .detail-content { padding: 14px; font-size: 20px; color: #CCC; display: none; max-height: 140px; overflow-y: auto; line-height: 1.5; }

        /* 巨大色块打分键 */
        .action-bar { height: 90px; display: flex; background-color: #111; border-top: 1px solid #222; padding: 12px 16px; gap: 14px; }
        .action-btn { flex: 1; border: none; border-radius: 18px; font-size: 28px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-wrong { background-color: #FF5252; color: #000; }
        .btn-fuzzy { background-color: #FFB74D; color: #000; }
        .btn-correct { background-color: #00E676; color: #000; }

        /* --- 2. 智能导入面板 --- */
        .panel-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .huge-select, .huge-input { width: 100%; background: #121212; border: 2px solid #333; border-radius: 14px; color: #FFF; padding: 14px; font-size: 18px; }
        .huge-input { height: 180px; resize: none; font-size: 16px; }
        .primary-btn { width: 100%; background: #00E676; color: #000; font-size: 22px; font-weight: bold; padding: 14px; border: none; border-radius: 16px; cursor: pointer; text-align: center; }
        .file-label { display: block; background: #222; border: 2px dashed #444; padding: 20px; text-align: center; border-radius: 16px; font-size: 18px; cursor: pointer; }

        /* --- 3. 仓库与备份面板 --- */
        .search-box { position: sticky; top: 0; background: #000; padding: 8px 0; z-index: 5; }
        .card-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .list-item { background: #121212; border: 1px solid #222; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .list-info { flex: 1; padding-right: 10px; }
        .list-title { font-size: 18px; font-weight: bold; color: #FFF; margin-bottom: 4px; }
        .list-sub { font-size: 14px; color: #888; }
        .del-btn { background: #FF5252; color: #000; border: none; padding: 6px 12px; font-size: 14px; font-weight: bold; border-radius: 8px; }
